<!-- Header -->
<header
  class="h-16 border-b border-dev-border flex items-center justify-between px-8 bg-(--base-900) backdrop-blur-md sticky top-0 z-10"
>
  <section class="flex-1 max-w-xl">
    <app-input
      type="email"
      placeholder="Search issues, pull requests or tasks (Cmd + K)"
      leftIcon="search"
    />
  </section>
  <div class="flex items-center gap-4 ml-6">
    <app-button variant="primary" size="sm" type="button"> + New Issue</app-button>
    <div class="h-8 w-px bg-(--base-400) mx-2"></div>
    <div class="flex items-center gap-3">
      <div class="text-right hidden sm:block">
        <p class="text-xs font-semibold text-white">{{ userName() }}</p>
        <p class="text-[10px] text-(--base-400)">{{ position() }}</p>
      </div>
      <div class="h-9 w-9 rounded-full bg-dev-border overflow-hidden border border-dev-border">
        <img
          class="w-full h-full bg-cover bg-center"
          data-alt="Developer profile avatar Alex Chen"
          src="{{ userProfileImage() }}"
        />
      </div>
    </div>
  </div>
</header>
